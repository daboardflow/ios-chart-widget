name: Render widget

"on":
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      chart:
        description: "Publish the fleet report, chart dashboard, or legacy medium chart"
        type: choice
        default: fleet
        options:
          - fleet
          - dashboard
          - current
          - wind-rose
          - iris

permissions:
  contents: write

concurrency:
  group: widget-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate the sample fleet report
        if: github.event_name == 'workflow_dispatch' && inputs.chart == 'fleet'
        run: python render_fleet.py
      - name: Render the large dashboard
        if: github.event_name == 'schedule' || inputs.chart == 'dashboard'
        run: python render_dashboard.py
      - name: Render the legacy medium chart
        if: github.event_name == 'schedule' || (inputs.chart != 'dashboard' && inputs.chart != 'fleet')
        env:
          CHART: ${{ inputs.chart || 'current' }}
        run: python render.py --chart "$CHART"
      - name: Publish changed dashboard and chart outputs
        run: |
          git add -- public/chart.png public/data.json
          if [ -d public/dashboard ]; then
            git add -- public/dashboard/wind-rose.png public/dashboard/mt-bruno.png public/dashboard/data.json
          fi
          if [ -d public/fleet ]; then
            git add -- public/fleet
          fi
          if git diff --cached --quiet; then
            echo "Chart and metadata unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render widget chart"
          git push
